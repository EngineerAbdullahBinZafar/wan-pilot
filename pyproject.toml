[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-video-toolkit"
version = "0.1.0"
description = "Production diagnostics, memory estimation, workflow compiler, and FastMCP server for Wan-Video (Wan2.1 & Wan2.2 MoE)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "EngineerAbdullahBinZafar"}
]
keywords = ["wan-video", "diffusion-transformer", "moe", "video-generation", "mcp", "comfyui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pillow>=9.0.0",
    "numpy>=1.22.0",
    "psutil>=5.8.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
diffusers = ["diffusers>=0.30.0", "accelerate"]
torch = ["torch>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-mock",
]

[project.scripts]
wan-pilot = "wan_video_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wan_video_toolkit*"]
