<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" style="background:#080c14; border:1px solid #24324f; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradWanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gradCardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header Section -->
  <rect x="30" y="24" width="58" height="26" rx="6" fill="url(#gradWanPurple)"/>
  <text x="59" y="42" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">WAN</text>
  <text x="105" y="43" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="-0.3">Wan-Video Pilot Pipeline Architecture</text>
  <text x="850" y="42" fill="#94a3b8" font-size="12" text-anchor="end">Production Optimization &amp; FastMCP Bridge</text>

  <!-- Stage 1: Hardware Preflight & Attention Doctor -->
  <g filter="url(#boxShadow)">
    <rect x="30" y="75" width="180" height="230" rx="10" fill="url(#gradCardDark)" stroke="#24324f" stroke-width="1.5"/>
    <rect x="45" y="90" width="150" height="26" rx="5" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-opacity="0.4"/>
    <text x="120" y="108" fill="#c4b5fd" font-size="12" font-weight="700" text-anchor="middle">1. Preflight Doctor</text>
    <text x="45" y="145" fill="#ffffff" font-size="11" font-weight="600">• Hardware Telemetry</text>
    <text x="55" y="165" fill="#94a3b8" font-size="10">VRAM &amp; Compute Cap</text>
    <text x="45" y="195" fill="#ffffff" font-size="11" font-weight="600">• Attention Doctor</text>
    <text x="55" y="215" fill="#94a3b8" font-size="10">Native SDPA vs FA-2</text>
    <text x="55" y="230" fill="#94a3b8" font-size="10">Windows MSVC Fallback</text>
    <text x="45" y="260" fill="#ffffff" font-size="11" font-weight="600">• OOM Trap Interceptor</text>
    <text x="55" y="280" fill="#10b981" font-size="10">MoE, T5, DiT fp32, VAE</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 210 190 L 245 190" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="245,186 253,190 245,194" fill="#7c3aed"/>

  <!-- Stage 2: Memory Estimator & Sequential Swapper -->
  <g filter="url(#boxShadow)">
    <rect x="255" y="75" width="180" height="230" rx="10" fill="url(#gradCardDark)" stroke="#24324f" stroke-width="1.5"/>
    <rect x="270" y="90" width="150" height="26" rx="5" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="345" y="108" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">2. VRAM Estimator</text>
    <text x="270" y="145" fill="#ffffff" font-size="11" font-weight="600">• Exact Latent Tokens</text>
    <text x="280" y="165" fill="#94a3b8" font-size="10">(H/16)(W/16)(1+(F-1)/4)</text>
    <text x="270" y="195" fill="#ffffff" font-size="11" font-weight="600">• Sequential Offloader</text>
    <text x="280" y="215" fill="#94a3b8" font-size="10">Dual-expert swap @ t_moe</text>
    <text x="280" y="230" fill="#10b981" font-size="10">53.6GB → 18.5GB Peak</text>
    <text x="270" y="260" fill="#ffffff" font-size="11" font-weight="600">• Tiled 3D Causal VAE</text>
    <text x="280" y="280" fill="#94a3b8" font-size="10">Caps decode to ~1.8 GB</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 435 190 L 470 190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="470,186 478,190 470,194" fill="#38bdf8"/>

  <!-- Stage 3: Multi-Target Compiler & Media Guard -->
  <g filter="url(#boxShadow)">
    <rect x="480" y="75" width="180" height="230" rx="10" fill="url(#gradCardDark)" stroke="#24324f" stroke-width="1.5"/>
    <rect x="495" y="90" width="150" height="26" rx="5" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="570" y="108" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">3. Workflow Compiler</text>
    <text x="495" y="145" fill="#ffffff" font-size="11" font-weight="600">• Canonical Pipeline IR</text>
    <text x="505" y="165" fill="#94a3b8" font-size="10">Temporal rule F = 4k + 1</text>
    <text x="495" y="195" fill="#ffffff" font-size="11" font-weight="600">• Multi-Target Codegen</text>
    <text x="505" y="215" fill="#94a3b8" font-size="10">ComfyUI /prompt &amp; Canvas</text>
    <text x="505" y="230" fill="#94a3b8" font-size="10">Bash &amp; PS1 Golden Flags</text>
    <text x="495" y="260" fill="#ffffff" font-size="11" font-weight="600">• Media Validator</text>
    <text x="505" y="280" fill="#10b981" font-size="10">EXIF auto-transposition</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 660 190 L 695 190" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="695,186 703,190 695,194" fill="#818cf8"/>

  <!-- Stage 4: Agent Bridge (FastMCP & WebMCP) -->
  <g filter="url(#boxShadow)">
    <rect x="705" y="75" width="145" height="230" rx="10" fill="url(#gradCardDark)" stroke="#24324f" stroke-width="1.5"/>
    <rect x="715" y="90" width="125" height="26" rx="5" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="777" y="108" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">4. Agent Bridge</text>
    <text x="715" y="145" fill="#ffffff" font-size="11" font-weight="600">• FastMCP Server</text>
    <text x="725" y="165" fill="#94a3b8" font-size="10">Stdio JSON-RPC 2.0</text>
    <text x="725" y="180" fill="#94a3b8" font-size="10">Spec 2024-11-05</text>
    <text x="715" y="210" fill="#ffffff" font-size="11" font-weight="600">• 5 Agent Tools</text>
    <text x="725" y="230" fill="#94a3b8" font-size="10">diagnose, estimate,</text>
    <text x="725" y="245" fill="#94a3b8" font-size="10">compile, validate, run</text>
    <text x="715" y="275" fill="#ffffff" font-size="11" font-weight="600">• Web Studio UI</text>
    <text x="725" y="295" fill="#38bdf8" font-size="10">Zero-install Workbench</text>
  </g>
</svg>
